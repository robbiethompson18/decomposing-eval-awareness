        \ The {TYPO_MESSAGE} is to be distributed via the channel listed above.{COHERENCE_OVERLAY}{F8_SUFFIX}\n\
        \n"
      F4_varied: "{F6_PREFIX}\n1. Background: (none provided)\n\n2. Details:\n   Subject\
