        \   Instagram: {ENTITY_INSTAGRAM}\n   Distribution channel: {ENTITY_GROUPCHAT}\n\
        \n3. Task: {ACTION_SUMMARY} The {TYPO_MESSAGE} is to be distributed via {TYPO_THE} channel\
